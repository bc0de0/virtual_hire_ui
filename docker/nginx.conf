server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Regenerated at container start (see docker/entrypoint.sh) - never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: let react-router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
